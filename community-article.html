<head>

<meta name="robots" content="index, follow">
<meta name="application-name" content="HCI">
<link rel="canonical" href="https://hci-1-fk7w.onrender.com/community-article.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="gate.js"></script>
</head>
<body>
  <a href="#main" class="skip-link">تخطي إلى المحتوى الرئيسي</a>

  <header>
    <div class="wrap nav">
      <a href="index.html" class="nav-brand" aria-label="HCI"><span class="logo">HCI</span></a>
      <nav class="nav-links" id="navLinks" aria-label="القائمة الرئيسية">
        <a href="foundation.html">ابدأ هنا</a>
        <a href="index.html#paths">المسارات</a>
        <a href="articles.html">المقالات</a>
      </nav>
      <span id="navCtaSlot" class="nav-auth">
        <a href="auth.html" class="nav-login">تسجيل الدخول</a>
        <a href="auth.html?tab=signup" class="nav-cta">إنشاء حساب</a>
      </span>
      <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="navLinks" aria-label="القائمة">☰</button>
    </div>
  </header>

  <main class="lesson" id="main">
    <div class="wrap">
      <a href="articles.html" class="page-back">المقالات</a>
      <div class="lesson-head reveal" id="articleHead">
        <span class="eyebrow">/// مقال متعلم</span>
        <h1 id="cArticleTitle">جاري التحميل…</h1>
        <p class="article-meta" id="cArticleMeta"></p>
      </div>
      <div class="article-body reveal" id="cArticleBody"></div>
      <p class="progress-note" id="cArticleError" hidden>المقال غير متاح أو لم يُنشر بعد.</p>
    </div>
  </main>

  <footer>
    <div class="wrap footer-inner">
      <div class="footer-brand">
        <a href="index.html" class="footer-logo">HCI</a>
        <p class="footer-tagline">خارطة طريق لتفاعل الإنسان والحاسوب</p>
      </div>
      <div class="footer-bottom">
        <div class="footer-credit-block">
          <span class="footer-credit">إعداد <strong>مازن عطية الذبياني</strong></span>
          <span class="footer-copy">© 2026 HCI</span>
        </div>
      </div>
    </div>
  </footer>

  <button id="backToTop" class="back-to-top" aria-label="إلى الأعلى">↑</button>
  <script src="api.js"></script>
  <script src="flow.js"></script>
<script src="main.js"></script>
  <script>
  (function () {
    var params = new URLSearchParams(location.search || '');
    var id = params.get('id');
    var titleEl = document.getElementById('cArticleTitle');
    var metaEl = document.getElementById('cArticleMeta');
    var bodyEl = document.getElementById('cArticleBody');
    var errEl = document.getElementById('cArticleError');
    if (!id || !window.HCIApi) {
      titleEl.textContent = 'مقال غير موجود';
      errEl.hidden = false;
      return;
    }
    HCIApi.fetchPublishedArticle(id).then(function (data) {
      var a = data && data.article;
      if (!a) throw new Error('missing');
      titleEl.textContent = a.title;
      document.title = a.title + ' — HCI';
      var d = a.publishedAt ? new Date(a.publishedAt) : null;
      metaEl.innerHTML = 'متعلم · ' + String(a.authorName || 'متعلم HCI').replace(/</g, '&lt;') +
        (d ? (' · ' + d.toLocaleDateString('ar-SA')) : '') +
        '<span class="article-byline">نُشر بعد مراجعة المشرف</span>';
      bodyEl.innerHTML = String(a.body || '')
        .split(/\n{2,}/)
        .map(function (p) {
          return '<p>' + p.replace(/</g, '&lt;').replace(/\n/g, '<br>') + '</p>';
        })
        .join('');
    }).catch(function () {
      titleEl.textContent = 'المقال غير متاح';
      errEl.hidden = false;
    });
  })();
  </script>
</body>
</html>
