<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>اختر مسارك — HCI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="gate.js"></script>
</head>
<body class="auth-page path-choice-page">
  <a href="#main" class="skip-link">تخطي إلى المحتوى الرئيسي</a>

  <div class="path-choice-wrap" id="main">
    <a href="index.html" class="brand" style="display:block; text-align:center;">HCI</a>
    <p class="brand-sub" style="margin-bottom:8px;">تفاعل الإنسان والحاسوب</p>
    <p class="brand-tagline" style="margin-bottom:36px;"><span class="dot"></span> خطوة واحدة لتحديد مسارك</p>

    <h1 class="path-choice-title" id="pathChoiceTitle">اختر مسارك</h1>
    <p class="path-choice-lead" id="pathChoiceLead">حدّد المسار المناسب لك للمتابعة. هذه أول خطوة بعد إنشاء حسابك.</p>

    <ol class="flow-rail flow-rail--compact" aria-label="تسلسل التعلّم" style="margin-bottom:28px;">
      <li data-flow="account" class="is-done"><span class="flow-rail-num">1</span><span class="flow-rail-label">الحساب</span></li>
      <li data-flow="start" class="is-current"><span class="flow-rail-num">2</span><span class="flow-rail-label">البداية</span></li>
      <li data-flow="paths" class="is-locked"><span class="flow-rail-num">3</span><span class="flow-rail-label">المسارات</span></li>
    </ol>

    <div class="path-choice-grid">
      <button type="button" class="path-option" id="chooseCurious">
        <span class="po-num">01</span>
        <h2>مهتم بالتخصص</h2>
        <p>أنت جديد أو تستكشف <strong>تفاعل الإنسان والحاسوب (HCI)</strong>. نقدّم لك نظرة شاملة ثم تبدأ المهام بالتدريج.</p>
        <span class="po-cta">البدء من الصفر <span class="po-arrow" aria-hidden="true">←</span></span>
      </button>

      <button type="button" class="path-option specialist" id="chooseSpecialist">
        <span class="po-num">02</span>
        <h2>متخصص في HCI</h2>
        <p>تعرف الأساسيات. نتجاوز البداية والاستكشاف، ونفتح المسارات والأدوات مباشرة — دون إعادة الدروس التمهيدية.</p>
        <span class="po-cta">إلى المسارات والأدوات <span class="po-arrow" aria-hidden="true">←</span></span>
      </button>
    </div>

    <p class="status-msg" id="statusMsg"></p>
  </div>

<script src="api.js"></script>
<script src="flow.js"></script>
<script src="main.js"></script>
<script>
(async function () {
  if (!window.HCIApi || !HCIApi.isLoggedIn()) {
    location.href = 'auth.html?tab=signup';
    return;
  }

  // لو اختار مسبقاً، لا نعيد السؤال
  var user = HCIApi.currentUser();
  if (user && user.pathType) {
    location.href = HCIApi.resolvePostAuthDestination(user, false);
    return;
  }

  var first = (window.HCIFlow && HCIFlow.firstName(user)) ||
    String((user && (user.fullName || user.firstName)) || '').trim().split(/\s+/)[0] || '';
  var titleEl = document.getElementById('pathChoiceTitle');
  var leadEl = document.getElementById('pathChoiceLead');
  if (titleEl && first) titleEl.textContent = first + '، اختر مسارك';
  if (leadEl) {
    leadEl.textContent = first
      ? 'حسابك جاهز. حدّد المسار المناسب لك — هذه أول خطوة في تسلسل التعلّم.'
      : 'حدّد المسار المناسب لك للمتابعة. هذه أول خطوة بعد إنشاء حسابك.';
  }

  var statusMsg = document.getElementById('statusMsg');
  var busy = false;

  async function pick(pathType) {
    if (busy) return;
    busy = true;
    statusMsg.textContent = 'جاري ضبط مسارك…';
    statusMsg.classList.add('show');

    try {
      var updated = await HCIApi.setPathType(pathType);

      if (pathType === 'specialist') {
        HCIApi.applySpecialistUnlocks();
        await HCIApi.syncProgress();
        location.href = 'index.html#paths';
        return;
      }

      // مهتم / جديد → صفحة التعريف الكاملة
      location.href = 'intro.html';
    } catch (err) {
      statusMsg.textContent = err.message;
      busy = false;
    }
  }

  document.getElementById('chooseCurious').addEventListener('click', function () {
    pick('curious');
  });
  document.getElementById('chooseSpecialist').addEventListener('click', function () {
    pick('specialist');
  });
})();
</script>
</body>
</html>
