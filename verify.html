<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>التحقق من الشهادة — HCI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="gate.js"></script>
<script src="api.js"></script>
</head>
<body class="cert-page verify-page">
  <a href="#verifyCard" class="skip-link">تخطي إلى نتيجة التحقق</a>

  <div class="cert-toolbar no-print">
    <a href="index.html" class="btn-ghost cert-tb-home">← الرئيسية</a>
    <a href="certificate.html" class="btn-ghost">الشهادة</a>
  </div>

  <main class="verify-wrap" id="verifyCard">
    <div class="verify-card" id="verifyResult">
      <p class="verify-brand">HCI · Verify Certificate</p>
      <h1 class="verify-title" id="verifyTitle">جاري التحقق…</h1>
      <p class="verify-sub" id="verifySub">نتحقق من رقم الشهادة.</p>
      <dl class="verify-meta" id="verifyMeta" hidden></dl>
    </div>
  </main>

<script>
(function () {
  var REG_KEY = 'hci_cert_registry';

  function qs(name) {
    var m = new RegExp('[?&]' + name + '=([^&]*)').exec(location.search);
    return m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : '';
  }

  function getRecord(id) {
    try {
      var reg = JSON.parse(localStorage.getItem(REG_KEY) || '{}');
      return reg[id] || null;
    } catch (e) {
      return null;
    }
  }

  function formatArDate(iso) {
    try { return new Date(iso).toLocaleDateString('ar-SA', { year: 'numeric', month: 'long', day: 'numeric' }); }
    catch (e) { return ''; }
  }

  function showChecking() {
    document.getElementById('verifyTitle').textContent = 'جاري التحقق…';
    document.getElementById('verifySub').textContent = 'نتحقق من رقم الشهادة.';
  }

  function showEmpty() {
    var meta = document.getElementById('verifyMeta');
    var card = document.getElementById('verifyResult');
    document.getElementById('verifyTitle').textContent = 'تحقق من شهادة HCI';
    document.getElementById('verifySub').textContent = 'امسح رمز QR الموجود على الشهادة للتحقق تلقائياً.';
    meta.hidden = true;
    card.classList.remove('is-valid', 'is-invalid');
  }

  function showInvalid(id) {
    var meta = document.getElementById('verifyMeta');
    var card = document.getElementById('verifyResult');
    document.getElementById('verifyTitle').textContent = 'تعذّر التحقق';
    document.getElementById('verifySub').textContent = 'لم نعثر على شهادة بهذا الرقم. تأكد من الرمز أو أن الشهادة صادرة فعلاً من منصة HCI.';
    meta.hidden = false;
    meta.innerHTML = '<div><dt>رقم الشهادة</dt><dd dir="ltr">' + escapeHtml(id) + '</dd></div>';
    card.classList.add('is-invalid');
    card.classList.remove('is-valid');
  }

  function showValid(rec) {
    var meta = document.getElementById('verifyMeta');
    var card = document.getElementById('verifyResult');
    document.getElementById('verifyTitle').textContent = 'شهادة موثّقة';
    document.getElementById('verifySub').textContent = 'تم التحقق بنجاح — هذه الشهادة صادرة عن منصة HCI.';
    meta.hidden = false;
    meta.innerHTML =
      '<div><dt>الاسم</dt><dd>' + escapeHtml(rec.name) + '</dd></div>' +
      '<div><dt>المسار</dt><dd>' + escapeHtml(rec.path || '') + '</dd></div>' +
      '<div><dt>الإنجاز</dt><dd>' + escapeHtml(String(rec.pct) + '%') + '</dd></div>' +
      '<div><dt>تاريخ الإصدار</dt><dd>' + escapeHtml(rec.issuedAr || formatArDate(rec.issued_at)) + '</dd></div>' +
      '<div><dt>تاريخ الإكمال</dt><dd>' + escapeHtml(rec.completedAr || formatArDate(rec.completed_at)) + '</dd></div>' +
      '<div><dt>رقم الشهادة</dt><dd dir="ltr">' + escapeHtml(rec.id) + '</dd></div>';
    card.classList.add('is-valid');
    card.classList.remove('is-invalid');
  }

  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }

  async function render(id) {
    if (!id) { showEmpty(); return; }
    showChecking();

    if (window.HCIApi && HCIApi.fetchCertificateById) {
      try {
        var resp = await HCIApi.fetchCertificateById(id);
        if (resp && resp.certificate) { showValid(resp.certificate); return; }
      } catch (e) { /* نكمل للاحتياطي المحلي */ }
    }

    var rec = getRecord(id);
    if (rec) { showValid(rec); return; }

    showInvalid(id);
  }

  render(qs('id'));
})();
</script>
</body>
</html>
